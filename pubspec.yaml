name: apex_hires
description: "ApexHires - Streamlined Job Recruitment Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (Spark plan compatible)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  firebase_messaging: ^15.2.2

  # Push Notifications
  onesignal_flutter: ^5.6.8

  # Supabase (file storage)
  supabase_flutter: ^2.8.4

  # Sharing & URL
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # State Management
  provider: ^6.1.2

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Charts
  fl_chart: ^0.70.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  file_picker: ^8.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
